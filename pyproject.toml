[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ert-visualization"
version = "0.1.0"
description = "Python tools for visualization of electrical resistivity tomography inversion results."
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "plotly",
    "nbformat>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]